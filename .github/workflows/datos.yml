name: Actualizar historiales
on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 4:00 hora de Sonora
  workflow_dispatch:
    inputs:
      liga:
        description: "Liga a actualizar (vacío = todas)"
        required: false
permissions:
  contents: write
concurrency:
  group: registro
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar partidos nuevos
        env:
          LIGA: ${{ github.event.inputs.liga }}
        run: |
          if [ -n "$LIGA" ]; then
            PYTHONPATH=src python -m predicciones.cli actualizar-datos --liga "$LIGA"
          else
            PYTHONPATH=src python -m predicciones.cli actualizar-datos
          fi
      - name: Guardar historiales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/historial/
          if ! git diff --cached --quiet; then
            git commit -m "Actualización semanal de historiales"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
