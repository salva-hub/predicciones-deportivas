name: Prueba contra el pasado
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      matrix:
        liga: [premier, laliga, serie_a, bundesliga, ligue_1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr prueba walk-forward 2022/23 a 2025/26
        run: |
          mkdir -p resultados/backtest
          PYTHONPATH=src python -m predicciones.backtest --liga ${{ matrix.liga }} --desde 2022 --hasta 2025 --salida resultados/backtest/${{ matrix.liga }}.json
      - name: Guardar resultado
        env:
          LIGA: ${{ matrix.liga }}
        run: .github/scripts/publicar.sh "Resultado de prueba contra el pasado ($LIGA)" resultados/
