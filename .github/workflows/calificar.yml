name: Calificar y publicar dashboard
on:
  schedule:
    - cron: "15 */3 * * *"   # cada 3 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["registro/**", "dashboard/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: registro
  cancel-in-progress: false
jobs:
  calificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calificar pronósticos y apuestas terminados
        run: PYTHONPATH=src python -m predicciones.cli calificar
      - name: Guardar cambios en el registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registro/
          if ! git diff --cached --quiet; then
            git commit -m "Calificación automática de resultados"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar sitio
        run: |
          mkdir -p _site/registro
          cp dashboard/index.html _site/
          cp registro/*.json _site/registro/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: calificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
